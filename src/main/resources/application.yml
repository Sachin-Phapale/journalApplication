weather:
  api:
    key: ${WEATHER_API_KEY:dummy-weather-key}
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-secret}
  main:
    allow-circular-references: true
    banner-mode: "off"
  server:
    port: ${SERVER_PORT:8080}
    # servlet:
    #   context-path: /journal
  redis:
    data:
      host: ${REDIS_HOST:localhost}
      port: 15641
      password: ${REDIS_PASSWORD:}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/journaldb}
      database: journaldb
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${JAVA_EMAIL:dummy@example.com}
    password: ${JAVA_EMAIL_PASSWORD:dummy-email-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: weekly-sentiment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: net.engineeringdigest.journalApp.model
    properties:
      security:
        protocol: SASL_SSL
      sasl:
        mechanism: PLAIN
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username='X' password='X';
      session:
        timeout:
          ms: 45000
mcp:
  server:
    name: "Journal App MCP Server"
    version: "1.0.0"
    transport: "stdio"
  security:
    default-user: "admin"